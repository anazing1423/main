<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Q1. javascript의 classList를 사용해서 다음 버튼을 클릭하면 ‘javascript’라는 글자가 사라지게 하세요. -->

  <button id="btn1">btn1</button>
  <h1>JavaScript</h1>

  <script>
    let btn1 = document.querySelector("#btn1")
    let h1 = document.querySelector("h1")

    btn1.addEventListener("click", function () {
      h1.classList.add("hidden");
    });
  </script>

  <!-- Q2. javascript의 querySelector()를 사용해서 다음 태그에 mouseover시 ‘자바스크립트’로, mouseout시 ‘javascript’로 바뀌게 하세요. -->
  <h1 id="title">javascript</h1>

  <script>
    let title = document.querySelector("#title")

    title.addEventListener("mouseover", function () {
      title.textContent = "자바스크립트";
    });
    title.addEventListener("mouseout", function () {
      title.textContent = "javascript";
    });
  </script>

  <!-- Q3.jquery의 prev()를 사용해서 다음 태그에서 id가 base인 div태그 바로 전 태그의 글자색을 red로 변경하세요. -->


  <div class="container">
    <div>div 요소</div>
    <div>div 요소</div>
    <div>div 요소</div>
    <div id="base">div 요소</div>
    <div>div 요소</div>
    <div>div 요소</div>
    <div>div 요소</div>
  </div>

  <script>
    $("#base").prev().css("color", "red");
  </script>


  <br>
  <!-- Q4. jquery의 ajax()를 사용해서 다음 member.json 파일에서 name,age,tel을 출력하세요. -->

  <div id="boxbox"></div>
  <script>
    $.ajax({
      url: "member.json",
      dataType: "json",
      success: function (data) {
        let a = "";
        for (let b = 0; b < data.length; b++) {
          a += data[b].name + "," + data[b].age + "," + data[b].tel + "<br>";
        }
        $("#boxbox").html(a); // ✅ text() → html()로 변경
      }
    });
  </script>
</body>

</html>
