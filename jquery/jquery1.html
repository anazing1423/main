<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Document</title>
  <script>
    $(document).ready(function () {
      //1. 웹페이지 배경 녹색
      $("#Q1").click(function () {
        $("body").css("background-color", "green");
      });
      //2. 이미지 오른쪽 이동
      $("#Q2").click(function () {
        $("img").css("transform", "translateX(300px)");
      });
      //3. 아코디언 제이쿼리
      $(".accordion").click(function () {
        let panel = $(this).next(".panel")

        if (panel.is(":visible")) {
          panel.stop().slideUp();
          $(this).css("background-color", "#eee");
        } else {
          panel.stop().slideDown();
          $(this).css("background-color", "#ccc");
        }
      });
      $(".accordion").hover(function () {
        $(this).css("background-color", "#ccc");
      },
        function () {
          if (!$(this).next(".panel").is(":visible")) {
            $(this).css("background-color", "#eee");
          }
        }
      );

      //4. 블로그 제이쿼리
   $("#topic").hover(
    function() { // 마우스 올릴 때
      $("#hide").stop().slideDown();
      $("#title").hide();
    },
    function() { // 마우스 내릴 때
      $("#hide").stop().slideUp();
      $("#title").show();
    }
  );
    });

  </script>
  <style>
    .accordion {
      background-color: #eee;
      color: #444;
      cursor: pointer;
      padding: 18px;
      width: 100%;
      text-align: left;
      border: none;
      outline: none;
      transition: 0.3s;
    }


    .panel {
      padding: 0 18px;
      background-color: white;
      display: none;
      overflow: hidden;
    }

    #topic {
      width: 300px;
      height: 290px;
      position: relative;
      background-image: url(blog.png);
      background-size: cover;
      background-repeat: no-repeat;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    #title {
      position: absolute;
      width: 300px;
      height: 100px;
      background-color: rgba(0, 0, 0, 0.781);
      text-align: center;
      bottom: 0;
      left: 0;
      padding: 0;
      margin: 0;
      color: aliceblue;
    }

    h2 {
      margin: 0;
      width: 300px;
    }

    #hide {
  display: none; 
  position: absolute; /* 추가 필요 */
  bottom: 0;          /* topic 안에서 정확히 위치 */
  left: 0;
  height: 290px;
  width: 300px;
  background-color: rgba(0, 0, 0, 0.781);
  text-align: center;
  color: aliceblue;
  box-sizing: border-box;
  padding-top: 50px;
  
}
#profile{
      display: flex;align-items: center;
      flex-direction: column;
      position: relative;
      
    }
#profile div{
  padding: 0;
margin: 0 auto;
}
    #pic{
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-image: url(blog.png);
      background-size: cover;
      left: 115px;
    }
    #n{
      position: absolute;
      top: 100px;
    }
    #a{
      position: absolute;
      top: 150px;
    }
    
  </style>
</head>

<body>
  <button id="Q1">녹색배경</button>
  <button id="Q2">오른쪽으로 이동</button>
  <img style="position: relative;" src="right.jpg" alt="화살표">

  <button class="accordion">1</button>
  <div class="panel">
    <p>blabla</p>
  </div>

  <button class="accordion">2</button>
  <div class="panel">
    <p>blabla</p>
  </div>

  <button class="accordion">3</button>
  <div class="panel">
    <p>blabla</p>
  </div>

  <div id="topic">
    <div id="title">
      <h2>핫토픽 <br> 모방하기</h2>
    </div>
    <div id="hide">
      <div id="profile">
        <div id="pic"></div>
        <div id="n">이름</div>
        <div id="a">기사내용</div>
      </div>
      
    </div>
  </div>
</body>

</html>
