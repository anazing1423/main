<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    button{
      z-index: 723;
      position: relative;
      top: 0;
    }
    #wolf{
      display: block;
      color: white;
      font-style: bold;
      font-size: 30px;
      border: 1px solid black;
      background-image: url(wolf.webp);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      width: 1000px;
      height: 800px;
      transition: all 0.3s ease;
      text-shadow: 
    -1px -1px 0 black,  
     1px -1px 0 black,
    -1px  1px 0 black,
     1px  1px 0 black;
    }
  </style>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    $(document).ready(function () {
      $("#btn1").click(function () {
        $("#wolf").hide();
      });
    });

    $(document).ready(function () {
      $("#btn2").click(function () {
        $("#wolf").show();
      });
    });

    $(document).ready(function () {
      $("#btn3").click(function () {
        $("#wolf").fadeIn();
      });
    });

    $(document).ready(function () {
      $("#btn4").click(function () {
        $("#wolf").fadeOut();
      });
    });

    $(document).ready(function () {
      $("#btn5").click(function () {
        $("#wolf").fadeToggle();
      });
    });
    $(document).ready(function () {
      $("#btn6").click(function () {
        $("#wolf").fadeTo(1000,0.5, function(){alert("아우우")});
      });
    });
    $(document).ready(function () {
      $("#btn7").click(function () {
        $("#wolf").fadeTo(2000,1, function(){alert("우우우")});
      });
    });
    $(document).ready(function () {
      $("#btn8").click(function () {
        $("#wolf").slideToggle("slow");
      });
    });
    $(document).ready(function () {
      $("#btn9").click(function () {
        $("#wolf").css("transform","scale(1)");
      });
    });
    $(document).ready(function () {
      $("#btn10").click(function () {
        $("#wolf").css("transform","scale(3)");
      });
    });
  </script>
</head>

<body>
<button id="btn1">1</button>
<button id="btn2">2</button>
<button id="btn3">3</button>
<button id="btn4">4</button>
<button id="btn5">5</button>
<button id="btn6">6</button>
<button id="btn7">7</button>
<button id="btn8">8</button>
<button id="btn9">9</button>
<button id="btn10">10</button>

<div id="wolf">oOOOOoOOouwlllllllLLLLLlll~~~~~~~!!!!</div>
</body>

</html>
