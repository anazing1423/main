<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slider연습</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    img {
      object-fit: cover;
    }

    .animation-canvas {
      width: 600px;
      height: 400px;
      overflow: hidden;
      position: relative;
      border: 2px solid red;
    }

    .slider-image {
      float: left;
      width: 600px;
      height: 400px;
    }

    .slider-panel {
      width: 3000px;
      position: relative;
    }

    .control-panel {
      position: absolute;
      bottom: 10px;
      left: 270px;
      overflow: hidden;
      color: white;

    }

    .dot {
      font-size: 20px;
      cursor: pointer;
      text-shadow: 1px 1px 1px black;
    }

    /* 화살표 버튼 스타일 */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      font-weight: bold;
      color: white;

      width: 50px;
      height: 50px;
      text-align: center;
      line-height: 50px;

    }

    .arrowbg:hover>.arrow {
      border: 1px;
    }

    .arrow.left {
      left: 10px;
    }

    .arrow.right {
      right: 10px;
    }

    .arrowbg.right {
      position: absolute;
      cursor: pointer;
      user-select: none;
      width: 90px;
      height: 400px;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.541), rgba(0, 0, 0, 0));
      right: 0;
    }

    .arrowbg.left {
      position: absolute;
      cursor: pointer;
      user-select: none;
      width: 90px;
      height: 400px;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.541), rgba(0, 0, 0, 0));
      left: 0;
    }
  </style>
</head>

<body>
  <div class="animation-canvas">
    <div class="slider-panel">
      <img src="images.png" alt="pic1" class="slider-image">
      <img src="2.webp" alt="pic2" class="slider-image">
      <img src="3.jpg" alt="pic3" class="slider-image">
      <img src="4.jpg" alt="pic4" class="slider-image">
      <img src="5.png" alt="pic5" class="slider-image">
    </div>

    <!-- 좌우 화살표 -->
    <div class="arrowbg left" id="al">
      <div class="arrow left">&#10094;</div>
    </div>
    <div class="arrowbg right" id="ar">
      <div class="arrow right">&#10095;</div>
    </div>


    <div class="control-panel" style="text-align: center;">
      <span class="dot">*</span>
      <span class="dot">*</span>
      <span class="dot">*</span>
      <span class="dot">*</span>
      <span class="dot">*</span>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      let currentIndex = 0; // 현재 보이는 슬라이드 인덱스
      const totalSlides = $('.slider-image').length;

      function moveSlider(index) {
        if (index < 0) index = 0;
        if (index >= totalSlides) index = totalSlides - 1;

        let willMoveLeft = -(index * 600);
        $('.slider-panel').stop(true, true).animate({ left: willMoveLeft }, 'slow');

        currentIndex = index; // 현재 인덱스 업데이트
      }

      // 인디케이터 클릭
      $('.dot').click(function () {
        let index = $(this).index();
        moveSlider(index);
      });

      // 좌/우 화살표 클릭
      $('#al').click(function () {
        moveSlider(currentIndex - 1);
      });
      $('#ar').click(function () {
        moveSlider(currentIndex + 1);
      });
    });
  </script>
</body>

</html>
