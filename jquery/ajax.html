<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function () {
      //csv처리
      $("#btn").click(function () {
        $.ajax({
          url: "https://www.data.go.kr/catalog/15029361/fileData.json", //서버주소
         dataType: "json",   // ✅ 응답을 JSON으로 파싱
          success: function (data) {  // 서버에서 응답이 왔을때(success) 실행할 함수. 응답 결과가 data에 저장됨.
            console.log(data); // ','를 기준으로 분리해서 배열에 넣어 리턴.
            
            let str = "이름:" + data.name + ","
                      +"설명:"+ data.description;
            $("#box").text(str);
          }
        })
      });
    });
  </script>
</head>

<body>
<button id="btn">Q1.</button>
<div id="box"></div>
</body>

</html>
