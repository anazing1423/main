<head>

  <title>Document</title>
  <script>
function Bg(element,color,tcolor) {
  element.style.backgroundColor=color;
  element.style.color=tcolor;
}
  </script>
</head>
<body>
  <ul>
    <li><a href="#" onclick="alert('다 사랑해~ 빠바바밤')">LOVE</a></li>
    <li><a href="#" onclick="Bg(this, 'red', 'white')">PURSE</a></li>
    <li><a href="#" onclick="Bg(this, 'green', 'white')">PURSE</a></li>
    <li><a href="#" onclick="Bg(this, 'orange', 'white')">PURSE</a></li>
    <li><a href="#" onclick="Bg(this, 'brown', 'white')">PURSE</a></li>
  </ul>




  
</body>
</html>
