<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Titan+One&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    * {
      font-family: "Audiowide", sans-serif;
      font-style: normal;
      font-weight: bold;
    }

    #total {
      position: relative;
      top: 200px;
      left: 35%;
      border: 5px solid rgb(92, 56, 12);
      width: 430px;
      height: 505px;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 28px;
      background-color: rgb(255, 253, 250);
      transform: scale(1.5);
    }

    #numpad {
      display: grid;
      grid: repeat(5, 70px) / repeat(4, 100px);
      margin: 0 auto;
    }

    label {
      display: block;
      width: 90px;
      height: 60px;
      border-radius: 20px;
      border: none;
      text-align: center;
      line-height: 60px;
      font-size: 20px;
      color: rgb(92, 56, 12);
      background-color: rgb(250, 232, 204);
    }

    label::selection {
      background-color: none;
      color: rgb(92, 56, 12);
    }

    .calculation {
      background-color: rgb(165, 103, 61);
    }

    #value {
      position: relative;
      width: 390px;
      height: 120px;
      border-radius: 20px;
      background-color: rgb(250, 232, 204);
      text-align: right;
      font-size: 30px;
      margin-bottom: 10px;
    }

    #typing {
      box-sizing: border-box;
      background-color: rgba(41, 74, 104, 0);
      color: rgb(92, 56, 12);
      border: none;
      position: absolute;
      bottom: 0;
      right: 10px;
      height: 70px;
      width: 390px;
      margin: 0;
      text-align: right;
      font-size: 40px;
      padding: 10px;
    }

    #typing:focus {
      outline: none;
    }

    #value::selection {
      background-color: rgb(165, 103, 61);
      color: rgb(250, 232, 204);
      border-radius: 20px;
    }

    #resuld {
      position: absolute;
      top: 0px;
      right: 30px;
    }

    #result {
      display: inline-block;
      text-align: right;
      font-size: 18px;
      color: rgba(92, 56, 12, 0.699);
    }
  </style>
</head>

<body>
  <div id="total">
    <div id="value">
      <div id="resuld">
        <p id="result"></p>
      </div>
      <input type="text" id="typing" class="value">
    </div>
    <div id="numpad">
      <div><label for="typing" class="calculation" id="reset">AC</label></div>
      <div><label for="typing" class="calculation" id="open">&lpar;</label></div>
      <div><label for="typing" class="calculation" id="close">&rpar;</label></div>
      <div><label for="typing" class="calculation" id="percent">&percnt;</label></div>
      <div><label for="typing" class="num" data-value="7">7</label></div>
      <div><label for="typing" class="num" data-value="8">8</label></div>
      <div><label for="typing" class="num" data-value="9">9</label></div>
      <div><label for="typing" class="calculation" id="plus">+</label></div>
      <div><label for="typing" class="num" data-value="4">4</label></div>
      <div><label for="typing" class="num" data-value="5">5</label></div>
      <div><label for="typing" class="num" data-value="6">6</label></div>
      <div><label for="typing" class="calculation" id="minus">-</label></div>
      <div><label for="typing" class="num" data-value="1">1</label></div>
      <div><label for="typing" class="num" data-value="2">2</label></div>
      <div><label for="typing" class="num" data-value="3">3</label></div>
      <div><label for="typing" class="calculation" id="*">&times;</label></div>
      <div><label for="typing" class="num" data-value=".">.</label></div>
      <div><label for="typing" class="num" data-value="0">0</label></div>
      <div><label for="typing" class="calculation" id="equal">&equals;</label></div>
      <div><label for="typing" class="calculation" id="divid">&divide;</label></div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      //enter키 이벤트 수정
      $("#typing").keydown(function (e) {
        if (e.key === "Enter") {  // Enter 키 감지
          e.preventDefault(); // 기본 동작 막기
          $("#equal").click(); // = 버튼 클릭 이벤트 그대로 실행
        }
      });

      //계산 결과
      $("#equal").click(function () {
        let expression = $("#typing").val();

        // 숫자 뒤에 괄호가 나오면 *로 바꿔주기
        expression = expression.replace(/(\d)\(/g, "$1*(");
        expression = expression.replace(/×/g, "*").replace(/÷/g, "/");

        try {
          let result = eval(expression);
          $("#result").text(result);
          $("#typing").val("");
        } catch (e) {
          alert("수식을 입력해주세요");
        }
      });

      //숫자 입력
      $(".num").click(function () {
        let value = $(this).data("value");//내가 누른 버튼의 data-value값이 value함수의 값이 되게 세팅
        $("#typing").val($("#typing").val() + value);
      });
      //연산자 입력
      $(".calculation").not("#reset,#equal").click(function () {
        //곱하기랑 나누기는 텍스트로 넣으면 자바스크립트가 계산못해서 함수로 값 바꿔놔야함
        let displayOperator = $(this).text();
        let currentVal = $("#typing").val();
        let lastResult = $("#result").text();

        if (currentVal === "" && lastResult !== "") {
          $("#typing").val(lastResult + displayOperator); // 이전 결과 뒤에 연산자
        } else if (currentVal === "" && lastResult === "") {
          alert("숫자를 먼저 입력해주세요");
        } else {
          $("#typing").val(currentVal + displayOperator);
        }
      });

      //전체취소
      $("#reset").click(function () {
        $("#typing").val("");
        $("#result").text("");
      });


    });


  </script>
</body>

</html>
