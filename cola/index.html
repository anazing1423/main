<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 코카-콜라</title>
  <link rel="icon" href="img/icon.png">
  <!-- 부트스트랩 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 슬라이더 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- 다른거 가져올때 jquery 있으면 충돌나니까 항상 주의-->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

  <!-- 폰트어썸 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


  <style>
    body {
      background: #eee;
    }


    /* 슬라이더 css */
    .slider-pc {
      display: block !important;
    }

    .slider-m {
      display: none !important;
    }



    .slider-container {
      width: 1250px;
      max-width: 100%;
      height: 100%;
      max-height: 590px;
      margin: 50px auto;
      aspect-ratio: 1250 / 590;
    }

    .slide {
      position: relative;
      /* 부모의 position 설정 */
    }

    .slide .caption,
    .slide .more {
      position: absolute;
      /* 자식 position:absolute 설정. grouping */
    }

    .slide .caption {
      left: 5px;
      top: 200px;
    }

    .slide .more {
      left: 5px;
      top: 300px;
    }

    .slider .slide {
      margin: 0 10px;
      /* 슬라이드 간 간격 */
    }

    .slider .slide img {
      aspect-ratio: 1250 / 590;
      width: 100%;
      max-height: 590px;
      object-fit: cover;
      border-radius: 10px;
    }

    .slider .slide .btn {
      background-color: white;
      color: rgb(0, 0, 0);
      font-weight: bold;
      padding-left: 50px;
      padding-right: 50px;
      border: none;
      border-radius: 50px;
    }

    /* 이달의 픽 */
    .row {
      display: flex;
      width: 1120px;
    }

    .thumbnail {
      position: relative;
      border-radius: 10px !important;
      background-color: white;
      overflow: hidden;
      height: 485px;

    }

    .thumbnail img {
      position: absolute;
      top: 0;
      width: 100%;
      height: 268px;
    }

    .pickt {
      position: absolute;
      height: 216px;
      bottom: 0;
      padding: 40px 30px;
    }

    .pickt a {
      color: black;
      text-decoration: underline;
    }
    .pickt a:hover {
      opacity: 95%;
      color: black;
    }

    @media screen and (max-width:1189px) {
      .slide {
        text-align: center !important;
      }

      .slider-pc {
        display: none !important;
      }

      .slider-m {
        display: block !important;
      }

      .slide .caption,
      .slide .more {
        width: 100%;
      }

      .slide .caption {
        top: 550px !important;
      }

      .slide .more {
        top: 650px !important;
      }

      .slider-container {
        width: 520px;
        max-width: 100%;
        height: 100%;
        max-height: 855px;
        margin: 50px auto;
        aspect-ratio: 520 / 855;
      }

      .slider .slide img {
        aspect-ratio: 520 / 855;
        width: 100%;
        max-height: 855px;
        object-fit: fill;
        border-radius: 10px;
      }
    }

    @media screen and (max-width:767px) {
      .slider-container {
        width: 520px;
        max-width: 100%;
        height: 100%;
        max-height: 855px;
        margin: 50px auto;
        aspect-ratio: 520 / 855;
      }

      .slider .slide img {
        aspect-ratio: 520 / 855;
        width: 100%;
        max-height: 855px;
        object-fit: fill;
        border-radius: 10px;
      }
    }

    /* 슬라이더 css */
  </style>
  <!-- jquery 코드 -->
  <script>
    $(document).ready(function () {
      $('.slider').slick({
        centerMode: true,
        centerPadding: '80px', // 양쪽에 보이는 슬라이드 넓이
        slidesToShow: 1,
        arrows: false,
        dots: true,
        responsive: [
          {
            breakpoint: 768,
            settings: {
              centerMode: true,
              centerPadding: '40px',
            }
          }
        ]
      });
    });
  </script>
</head>

<body>
  <!-- slider ------------------------------->
  <div class="slider-container">
    <div class="slider">
      <div class="slide">
        <img class="slider-pc" src="img/1.webp" alt="1">
        <img class="slider-m" src="img/semo1.webp" alt="semo1">
        <div class="caption">
          <h3>코카-콜라와 뷔,<br>이토록 짜릿한 만남!</h3>
          <p>뷔, 코카-콜라 앰배서더 발탁</p>
        </div>
        <div class="more">
          <a class="btn btn-primary" href="#">자세히 보기</a>
        </div>
      </div>
      <div class="slide">
        <img class="slider-pc" src="img/2.webp" alt="2">
        <img class="slider-m" src="img/semo2.webp" alt="semo2">
      </div>
      <div class="slide">
        <img class="slider-pc" src="img/3.webp" alt="3">
        <img class="slider-m" src="img/semo3.webp" alt="semo3">
      </div>
      <div class="slide">
        <img class="slider-pc" src="img/4.webp" alt="4">
        <img class="slider-m" src="img/semo4.webp" alt="semo4">
      </div>
      <div class="slide">
        <img class="slider-pc" src="img/5.webp" alt="5">
        <img class="slider-m" src="img/semo5.webp" alt="semo5">
      </div>
      <div class="slide">
        <img class="slider-pc" src="img/6.webp" alt="6">
        <img class="slider-m" src="img/semo6.webp" alt="semo6">
      </div>
      <div class="slide">
        <img class="slider-pc" src="img/7.webp" alt="7">
        <img class="slider-m" src="img/semo7.webp" alt="semo7">
      </div>
    </div>
  </div>

  <!-- 이달의 픽 -->
  <div id="pick" class="container">
    <h1 class="text-center">이달의 픽</h1>
    <div class="row">
      <div class="col-md-4">
        <div class="thumbnail">
          <img src="img/drpepper.webp" alt="닥터페퍼">
          <div class="pickt">
            <p><strong>달콤하고 부드러운 딸기크림향, 그런데 닥터페퍼 제로라니</strong></p>
            <a href="1#">더 보기<i class="fa-solid fa-arrow-right"></i></a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="thumbnail">
          <img src="img/sprite.webp" alt="스프라이트">
          <div class="pickt">
            <p><strong>치열한 일상 속 Chill한 상쾌함, 스프라이트 제로 Chill</strong></p>
            <a href="2#">더 보기<i class="fa-solid fa-arrow-right"></i></a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="thumbnail">
          <img src="img/power.webp" alt="파워에이드">
          <div class="pickt">
            <p><strong>달리다 보면 너의 음료를 알게 될 거야, 파워 에이드 제로 라임향</strong></p>
            <a href="3#">더 보기<i class="fa-solid fa-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </div>
  </div>


</body>

</html>
