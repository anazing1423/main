<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    #total {
      border: 1px solid black;
      width: 430px;
      height: 505px;
      box-sizing: border-box;
      padding: 15px;
    }
    #numpad {
      display: grid;
      grid: repeat(5, 70px) / repeat(4, 100px);
      margin: 0 auto;
    }
    label {
      display: block;
      width: 90px;
      height: 60px;
      border-radius: 20px;
      border: none;
      font-size: 20px;
      text-align: center;
      line-height: ;
    }
    .calculation {
      background-color: rgb(199, 128, 128);
    }
    #value {
      position: relative;
      width: 390px;
      height: 120px;
      border-radius: 20px;
      background-color: aliceblue;
      text-align: right;
      font-size: 30px;
      margin-bottom: 5px;
    }
    #typing {
      box-sizing: border-box;
      background-color: rgba(41, 74, 104, 0);
      border: none;
      position: absolute;
      bottom: 0;
      right: 0;
      height: 70px;
      width: 390px;
      margin: 0;
      text-align: right;
      font-size: 40px;
      padding: 10px;
    }
    #typing:focus { outline: none; }
    #result {
      position: absolute;
      top: 10px;
      right: 20px;
      text-align: right;
      font-size: 18px;
      color: rgb(154, 162, 168);
    }
  </style>
</head>
<body>
  <div id="total">
    <div id="value">
      <div id="result"></div>
      <input type="text" id="typing" class="value">
    </div>
    <div id="numpad">
      <div><label for="typing" class="calculation" id="reset">AC</label></div>
      <div><label for="typing" class="calculation" id="open">(</label></div>
      <div><label for="typing" class="calculation" id="close">)</label></div>
      <div><label for="typing" class="calculation" id="percent">%</label></div>

      <div><label for="typing" class="num" data-value="7">7</label></div>
      <div><label for="typing" class="num" data-value="8">8</label></div>
      <div><label for="typing" class="num" data-value="9">9</label></div>
      <div><label for="typing" class="calculation">÷</label></div>

      <div><label for="typing" class="num" data-value="4">4</label></div>
      <div><label for="typing" class="num" data-value="5">5</label></div>
      <div><label for="typing" class="num" data-value="6">6</label></div>
      <div><label for="typing" class="calculation">×</label></div>

      <div><label for="typing" class="num" data-value="1">1</label></div>
      <div><label for="typing" class="num" data-value="2">2</label></div>
      <div><label for="typing" class="num" data-value="3">3</label></div>
      <div><label for="typing" class="calculation" id="minus">−</label></div>

      <div><label for="typing" class="num" data-value=".">.</label></div>
      <div><label for="typing" class="num" data-value="0">0</label></div>
      <div><label for="typing" class="calculation" id="equal">=</label></div>
      <div><label for="typing" class="calculation" id="plus">+</label></div>
    </div>
  </div>

  <script>
    $(document).ready(function(){

      // 숫자 입력
      $(".num").click(function(){
        let value = $(this).data("value");
        $("#typing").val($("#typing").val() + value);
      });

      // 연산자 입력 (AC, = 제외)
      $(".calculation").not("#reset,#equal").click(function(){
        let operator = $(this).text();
        if(operator === "×") operator = "*";
        if(operator === "÷") operator = "/";
        $("#typing").val($("#typing").val() + operator);
      });

      // 전체취소
      $("#reset").click(function(){
        $("#typing").val("");
        $("#result").text("");
      });

      // 계산 함수
      function calculate(){
        let expression = $("#typing").val();
        try{
          expression = expression.replace(/×/g,"*").replace(/÷/g,"/");
          let result = eval(expression);
          $("#result").text(result);
          $("#typing").val("");
        } catch(e){
          alert("수식을 입력해주세요");
        }
      }

      // = 버튼 클릭
      $("#equal").click(function(){
        calculate();
      });

      // Enter 키 입력
      $("#typing").keydown(function(e){
        if(e.key === "Enter"){
          e.preventDefault(); // 버튼 눌림 방지
          calculate();
        }
      });

    });
  </script>
</body>
</html>
